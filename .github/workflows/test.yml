name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    name: pytest (Python ${{ matrix.python }}, ${{ matrix.deps }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
        deps: [latest]
        include:
          # pyproject.toml 宣告的最低版本，確認下限也能重現 README 的數字
          - python: "3.10"
            deps: minimum
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install (minimum)
        if: matrix.deps == 'minimum'
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy==1.24.4" "pandas==2.0.3" "statsmodels==0.14.0" "scipy<1.12" pytest
          python -m pip install --no-deps -e .
      - name: Install (latest)
        if: matrix.deps == 'latest'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - name: Run tests
        run: python -m pytest -rs
